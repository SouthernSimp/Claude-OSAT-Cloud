<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a6e"/>
      <stop offset="0.52" stop-color="#3d68a6"/>
      <stop offset="0.72" stop-color="#b79ab0"/>
      <stop offset="1" stop-color="#2a4a7a"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.66" r="0.55">
      <stop offset="0" stop-color="#f6d7c0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f6d7c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffb07a"/>
      <stop offset="0.55" stop-color="#e2672f"/>
      <stop offset="1" stop-color="#a3411d"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a4c" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff8a4c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#lake)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#haze)"/>
    <!-- the far shore -->
    <path d="M100 690 C 260 650, 380 672, 512 660 S 790 640, 924 676 L924 924 L100 924 Z" fill="#1a3260" opacity="0.8"/>
    <!-- the glass ring: the O of OSAT -->
    <circle cx="512" cy="470" r="196" fill="none" stroke="url(#glass)" stroke-width="84"/>
    <circle cx="512" cy="470" r="238" fill="none" stroke="url(#rim)" stroke-width="5"/>
    <circle cx="512" cy="470" r="154" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4"/>
    <!-- one ember -->
    <circle cx="512" cy="470" r="120" fill="url(#glow)"/>
    <circle cx="512" cy="470" r="62" fill="url(#ember)"/>
    <ellipse cx="494" cy="448" rx="20" ry="13" fill="#fff" opacity="0.45" filter="url(#soft)"/>
    <!-- its reflection on the water -->
    <rect x="496" y="738" width="32" height="7" rx="3.5" fill="#ffb07a" opacity="0.75"/>
    <rect x="484" y="760" width="56" height="6" rx="3" fill="#ffb07a" opacity="0.45"/>
    <rect x="500" y="780" width="24" height="5" rx="2.5" fill="#ffb07a" opacity="0.3"/>
    <!-- top light on the tile -->
    <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>
  </g>
</svg>
