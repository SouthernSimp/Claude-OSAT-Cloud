name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels an older pull-request run, never a build of main (that is the Mac app people update to).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Tests, build and screenshots
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # The AI engine ships prebuilt; its install step would only test-load it.
      NODE_LLAMA_CPP_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install the browser for the screenshot test
        run: npx playwright install --with-deps chromium
      - name: Open every room and take screenshots
        run: npm run test:ui
      - name: Run the real app (Electron) end to end
        run: |
          node node_modules/electron/install.js
          xvfb-run -a npm run test:e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/ui/
          retention-days: 14
          if-no-files-found: ignore

  mac:
    name: Mac app (DMG to try)
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write # to publish the build of main as a release (Settings → About → Check for updates)
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      NODE_LLAMA_CPP_SKIP_DOWNLOAD: "true"
      # Every build is numbered 0.1.<run>, so the app can tell a newer one from the one it is.
      OSAT_BUILD_VERSION: 0.1.${{ github.run_number }}
      # Optional. When these repository secrets exist the app is signed with the
      # Developer ID and notarized, so it opens with no warning. Without them the
      # build is ad-hoc signed and needs one "Open Anyway" in System Settings.
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      # OSAT's own steady signing identity (a self-signed certificate, not an Apple one). Every build carries the
      # same signature, so macOS keeps the permissions given to OSAT (Accessibility, to paste and move windows)
      # across updates instead of forgetting them with each new ad-hoc build. Still needs one "Open Anyway".
      OSAT_SIGN_P12: ${{ secrets.OSAT_SIGN_P12 }}
      OSAT_SIGN_PASSWORD: ${{ secrets.OSAT_SIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run build
      - name: Check keys go in and out of the Keychain
        run: node scripts/keychain-check.cjs
      - name: Check OSAT reads the words on a scan
        run: node scripts/scan-read-check.cjs
      - name: Check Spotlight takes OSAT's find queries
        run: node scripts/find-check.mjs
      - name: Check the Bin takes a file and says where it landed
        run: node scripts/bin-check.cjs
      - name: Build the DMG
        env:
          # electron-builder skips all signing on pull requests by default, which
          # leaves a bundle macOS reports as "damaged". Sign these builds too.
          CSC_FOR_PULL_REQUEST: "true"
        run: |
          if [ -n "$CSC_LINK" ]; then
            if [ -n "$APPLE_API_KEY_P8" ]; then
              printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            fi
            npx electron-builder --mac dmg zip --arm64 --publish never -c.extraMetadata.version="$OSAT_BUILD_VERSION"
          elif [ -n "$OSAT_SIGN_P12" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            # Pack the app, sign it with the steady identity, then make the DMG and zip from that signed app.
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dir --arm64 --publish never -c.mac.identity=- -c.extraMetadata.version="$OSAT_BUILD_VERSION"
            KC="$RUNNER_TEMP/osat.keychain-db"; KCPW="$(uuidgen)"
            security create-keychain -p "$KCPW" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KCPW" "$KC"
            printf '%s' "$OSAT_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/osat.p12"
            security import "$RUNNER_TEMP/osat.p12" -k "$KC" -P "$OSAT_SIGN_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" > /dev/null
            # codesign only looks in the keychains on the search list.
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/osat.p12"
            # A self-signed certificate is "not trusted" to macOS, so it is picked by its hash, not by `-v`.
            HASH="$(security find-identity -p codesigning "$KC" | awk '/OSAT Local Signing/ {print $2; exit}')"
            test -n "$HASH"
            codesign --force --deep --options runtime --entitlements build/entitlements.mac.plist --keychain "$KC" --sign "$HASH" release/mac-arm64/OSAT.app
            security delete-keychain "$KC"
            codesign --verify --deep --strict release/mac-arm64/OSAT.app
            codesign -d -r- release/mac-arm64/OSAT.app
            npx electron-builder --prepackaged release/mac-arm64/OSAT.app --mac dmg zip --arm64 --publish never -c.mac.identity=null -c.extraMetadata.version="$OSAT_BUILD_VERSION"
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dmg zip --arm64 --publish never -c.mac.identity=- -c.extraMetadata.version="$OSAT_BUILD_VERSION"
          fi
      - name: Check the app starts
        run: |
          APP="$(ls -d release/mac-arm64/OSAT.app)"
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/MacOS/OSAT" > launch.log 2>&1 &
          PID=$!
          sleep 20
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "OSAT quit on its own during launch:"; cat launch.log; exit 1
          fi
          kill "$PID"
          test -f "$HOME/Library/Application Support/OSAT/osat-data-folder.json"
      - name: Check the AI engine loads inside the app
        run: |
          APP="$(ls -d release/mac-arm64/OSAT.app)"
          "$APP/Contents/MacOS/OSAT" --osat-self-test 2>&1 | tee self-test.log
          grep -q "OSAT self-test: engine ok" self-test.log
      - uses: actions/upload-artifact@v4
        with:
          name: OSAT-mac-dmg
          path: release/*.dmg
          retention-days: 14
      # A build of main becomes the newest release; the app's own update button looks here.
      - name: Publish this build for Check for updates
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="$(ls release/OSAT-*-arm64-mac.zip)"
          shasum -a 256 "$ZIP" | cut -d' ' -f1 > "$ZIP.sha256"
          gh release create "v$OSAT_BUILD_VERSION" "$ZIP" "$ZIP.sha256" release/*.dmg \
            --title "OSAT build ${GITHUB_RUN_NUMBER}" --notes "Built from ${GITHUB_SHA}. Install it with Settings → About → Check for updates." --latest

  iphone:
    name: iPhone app (simulator)
    # The iPhone app is parked, so this only runs after a merge to main or by hand
    # (Actions → CI → Run workflow), not on every pull request. It builds the web app into the
    # iOS shell, so it is not filtered by path: any src/ change can affect it.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      NODE_LLAMA_CPP_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build the iPhone app for the simulator
        run: |
          brew install xcodegen
          rm -rf ios/Web && cp -R dist/client ios/Web
          cd ios
          xcodegen generate
          xcodebuild -project OSAT.xcodeproj -scheme OSAT -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Open it in the simulator and take a picture
        run: |
          DEVICE="$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" ios/build/Build/Products/Debug-iphonesimulator/OSAT.app
          xcrun simctl launch "$DEVICE" ai.mccreery.osat
          sleep 20
          mkdir -p test-results/iphone
          xcrun simctl io "$DEVICE" screenshot test-results/iphone/today.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-screenshot
          path: test-results/iphone/
          retention-days: 14
          if-no-files-found: ignore
