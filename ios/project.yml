# The OSAT iPhone app. Generate the Xcode project with XcodeGen (brew install xcodegen):
#   npm run build && rm -rf ios/Web && cp -R dist/client ios/Web && cd ios && xcodegen generate
# The screens are the same web app as the Mac (?surface=phone); Swift only gives it
# files, iCloud and a window.
name: OSAT
options:
  bundleIdPrefix: ai.mccreery
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OSAT:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: OSAT
      - path: Web
        type: folder
        buildPhase: resources
    info:
      path: OSAT/Info.plist
      properties:
        CFBundleDisplayName: OSAT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # The app's iCloud folder shows in Files as "OSAT", next to the Mac's.
        NSUbiquitousContainers:
          iCloud.ai.mccreery.osat:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: OSAT
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: OSAT/OSAT.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.ai.mccreery.osat]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.ai.mccreery.osat]
        com.apple.developer.icloud-services: [CloudDocuments]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.mccreery.osat
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
